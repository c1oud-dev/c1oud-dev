<svg
  width="1000"
  height="180"
  viewBox="0 0 1000 180"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
  preserveAspectRatio="xMinYMid meet"
>
  <title id="title">Kim Ha Neul GitHub profile header</title>
  <desc id="desc">
    Minimal GitHub profile header with name, backend developer title, and keywords
  </desc>

  <style>
    .accent {
      fill: #1E5FA0;
    }

    .name {
      fill: #171717;
    }

    .subtitle {
      fill: #315A7D;
    }

    .keywords {
      fill: #334E68;
    }

    @media (prefers-color-scheme: dark) {
      .accent {
        fill: #79C5FF;
      }

      .name {
        fill: #F5F7FA;
      }

      .subtitle {
        fill: #B9DFFF;
      }

      .keywords {
        fill: #A8CCE5;
      }
    }
  </style>

  <!-- 왼쪽 포인트 선 -->
  <rect
    class="accent"
    x="18"
    y="35"
    width="4"
    height="110"
    rx="2"
  />

  <!-- 이름 -->
  <text
    class="name"
    x="42"
    y="76"
    font-family="'Fira Sans', 'Pretendard', Arial, sans-serif"
    font-size="48"
    font-weight="700"
  >
    Kim Ha Neul
  </text>

  <!-- 직무 및 기술 -->
  <text
    class="subtitle"
    x="43"
    y="111"
    font-family="'Fira Sans', 'Pretendard', Arial, sans-serif"
    font-size="19"
    font-weight="400"
    letter-spacing="0.4"
  >
    Back-end Developer · Spring Boot · JPA
  </text>

  <!-- 개발 키워드 -->
  <text
    class="keywords"
    x="43"
    y="139"
    font-family="'Fira Sans', 'Pretendard', Arial, sans-serif"
    font-size="15"
    font-weight="400"
    letter-spacing="1"
  >
    Problem Solving · Clean Code · Continuous Learning
  </text>
</svg>
