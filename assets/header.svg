<svg
  width="1000"
  height="200"
  viewBox="0 0 1000 200"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Kim Ha Neul GitHub profile banner</title>
  <desc id="desc">Minimal banner with name and keywords</desc>

  <style>
    .accent {
      fill: #1E5FA0;
    }

    .name {
      fill: #1A1A1A;
      font: 700 52px 'Fira Sans', 'Pretendard', sans-serif;
    }

    .subtitle {
      fill: #355C7D;
      font: 400 20px 'Fira Sans', 'Pretendard', sans-serif;
      letter-spacing: 0.5px;
    }

    .keywords {
      fill: #3F5F78;
      font: 400 15px 'Fira Sans', 'Pretendard', sans-serif;
      letter-spacing: 1.2px;
    }

    @media (prefers-color-scheme: dark) {
      .accent {
        fill: #7CC7FF;
      }

      .name {
        fill: #F5FAFF;
      }

      .subtitle {
        fill: #B9DFFF;
      }

      .keywords {
        fill: #8FC4E8;
      }
    }
  </style>

  <!-- 왼쪽 포인트 선 -->
  <rect
    class="accent"
    x="68"
    y="58"
    width="4"
    height="114"
    rx="2"
  />

  <!-- 이름 -->
  <text class="name" x="92" y="105">
    Kim Ha Neul
  </text>

  <!-- 서브타이틀 -->
  <text class="subtitle" x="92" y="140">
    Back-end Developer · Spring Boot · JPA
  </text>

  <!-- 키워드 -->
  <text class="keywords" x="92" y="168">
    Problem Solving · Clean Code · Continuous Learning
  </text>
</svg>
