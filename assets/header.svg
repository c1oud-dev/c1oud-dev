<svg
  width="760"
  height="150"
  viewBox="0 0 760 150"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Kim Ha Neul GitHub profile header</title>
  <desc id="desc">Minimal profile header with name and keywords</desc>

  <style>
    .accent {
      fill: #1E5FA0;
    }

    .name {
      fill: #171717;
      font: 700 42px 'Fira Sans', 'Pretendard', sans-serif;
    }

    .subtitle {
      fill: #315A7D;
      font: 400 17px 'Fira Sans', 'Pretendard', sans-serif;
      letter-spacing: 0.3px;
    }

    .keywords {
      fill: #3F5F78;
      font: 400 14px 'Fira Sans', 'Pretendard', sans-serif;
      letter-spacing: 0.8px;
    }

    @media (prefers-color-scheme: dark) {
      .accent {
        fill: #79C5FF;
      }

      .name {
        fill: #F5F7FA;
      }

      .subtitle {
        fill: #B9DFFF;
      }

      .keywords {
        fill: #9AC9E8;
      }
    }
  </style>

  <!-- 왼쪽 포인트 선 -->
  <rect
    class="accent"
    x="20"
    y="27"
    width="3"
    height="100"
    rx="1.5"
  />

  <!-- 이름 -->
  <text class="name" x="40" y="68">
    Kim Ha Neul
  </text>

  <!-- 서브타이틀 -->
  <text class="subtitle" x="41" y="98">
    Back-end Developer · Spring Boot · JPA
  </text>

  <!-- 키워드 -->
  <text class="keywords" x="41" y="123">
    Problem Solving · Clean Code · Continuous Learning
  </text>
</svg>
